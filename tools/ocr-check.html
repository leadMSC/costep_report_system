<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><title>ocr-check</title></head>
<body>
<!-- 스캔 서류 글자 인식 점검: 앱과 같은 순서(pdf.js 로 쪽 그리기 → cleanScan → tesseract kor+eng → 해석기)로
     쪽마다 읽어 결과를 <pre id="out"> 에 넣는다(브라우저 창에서 열어 확인. 헤드리스는 OCR 을 기다리지 못함 — 앱 전체 점검은 tools/docs_e2e.js).
     사용: ocr-check.html?f=../tests/pdf_sample/ip/s01.pdf  (실제 서류는 tests/pdf_sample/ — 저장소에 안 올라감) -->
<pre id="st"></pre>
<pre id="out"></pre>
<script src="../vendor/pdfjs/pdf.min.js"></script>
<script src="../tools/doc-parsers.js"></script>
<script src="../vendor/ocr/tesseract.min.js"></script>
<script>
  (async () => {
    const out = document.getElementById('out');
    try {
      const qs = new URLSearchParams(location.search);
      const P = window.MSCDocParsers;
      pdfjsLib.GlobalWorkerOptions.workerSrc = '../vendor/pdfjs/pdf.worker.min.js';
      const base = new URL('../vendor/ocr/', location.href).href;
      const worker = await Tesseract.createWorker(['kor', 'eng'], 1, { workerPath: base + 'worker.min.js', corePath: base, langPath: base + 'lang', gzip: true, logger: m => { document.getElementById('st').textContent = m.status + ' ' + Math.round((m.progress || 0) * 100) + '%'; } });
      const res = [];
      const raw = qs.get('raw') === '1';
      // list=그림 목록(json): 쪽을 미리 그림으로 만들어 둔 경우(화면이 안 그려지는 환경에서도 돎)
      if (qs.get('list')) {
        const files = await (await fetch(qs.get('list'))).json();
        const dir = qs.get('list').replace(/[^/]*$/, '');
        for (const f of files) {
          const im = new Image(); im.src = dir + f.replace(/^png\//, ''); await im.decode();
          const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight;
          const ctx = c.getContext('2d'); ctx.drawImage(im, 0, 0);
          if (qs.get('clean') !== '0') { const img = ctx.getImageData(0, 0, c.width, c.height); P.cleanScan(img.data, c.width, c.height); ctx.putImageData(img, 0, 0); }
          const t0 = performance.now();
          const { data } = await worker.recognize(c, {}, { text: true, blocks: true });
          let text = P.redact(data.text);
          // retitle=1: 명칭 줄만 한글 전용으로 다시 읽기(영문 모델이 한글 낱말을 영문으로 읽는 경우 대비)
          if (qs.get('retitle') === '1') {
            const lines = (data.blocks || []).flatMap(b => b.paragraphs.flatMap(p => p.lines));
            const i = lines.findIndex(l => /Title\s*of|of\s*the\s*(Invention|Device)|Article|roduc|Product|대상이\s*되는\s*물품/i.test(l.text));
            if (i >= 0 && lines[i + 1]) {
              const b0 = lines[i + 1].bbox;
              window.__kw = window.__kw || await Tesseract.createWorker(['kor'], 1, { workerPath: base + 'worker.min.js', corePath: base, langPath: base + 'lang', gzip: true });
              const r2 = await window.__kw.recognize(c, { rectangle: { left: Math.max(0, b0.x0 - 20), top: Math.max(0, b0.y0 - 12), width: b0.x1 - b0.x0 + 40, height: b0.y1 - b0.y0 + 24 } });
              res.push({ file: f + '#title', ms: 0, text: 'FIRST: ' + lines[i + 1].text.trim() + ' | KOR: ' + r2.data.text.trim() });
            }
          }
          res.push({ file: f, ms: Math.round(performance.now() - t0), text });
          document.getElementById('st').textContent = res.length + '/' + files.length;
        }
        await worker.terminate();
        window.__res = res;
        out.textContent = 'OK:' + JSON.stringify(res.map(r => ({ file: r.file, ms: r.ms, len: r.text.length })));
        return;
      }
      const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await (await fetch(qs.get('f'))).arrayBuffer()), isEvalSupported: false }).promise;
      for (let p = 1; p <= Math.min(doc.numPages, 20); p++) {
        const page = await doc.getPage(p);
        const vp0 = page.getViewport({ scale: 1 });
        const vp = page.getViewport({ scale: Math.min(3.5, 3000 / Math.max(vp0.width, vp0.height)) });
        const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
        const ctx = c.getContext('2d');
        await page.render({ canvasContext: ctx, viewport: vp }).promise;
        if (qs.get('clean') !== '0') { const img = ctx.getImageData(0, 0, c.width, c.height); P.cleanScan(img.data, c.width, c.height); ctx.putImageData(img, 0, 0); }
        const t0 = performance.now();
        const { data } = await worker.recognize(c);
        const text = P.redact(data.text);
        const ip = P.parseIP(text);
        res.push({ page: p, ms: Math.round(performance.now() - t0), ip: ip.item, notes: ip.notes, text: raw ? text : undefined });
      }
      await worker.terminate();
      out.textContent = 'OK:' + JSON.stringify(res);
    } catch (e) { out.textContent = 'ERR:' + (e && e.message || e); }
  })();
</script>
</body>
</html>
